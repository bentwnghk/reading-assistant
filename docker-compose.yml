version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: reading-assistant-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - reading-assistant_postgres_data:/var/lib/postgresql/data
      - /home/user/reading-assistant/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 24g
        reservations:
          memory: 12g
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "effective_cache_size=18GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "checkpoint_completion_target=0.9"

  reading-assistant:
    image: 
    container_name: reading-assistant
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g
    environment:
      # Access Password (comma-separated, case-sensitive)
      ACCESS_PASSWORD: ""
      OPENAI_COMPATIBLE_API_BASE_URL: "https://api.mr5ai.com"
      OPENAI_COMPATIBLE_API_KEY: ""
      # Fallback model when the primary AI model fails (default: gemini-3-flash-preview)
      FALLBACK_MODEL: "gemini-3-flash-preview"
      # Text-to-image model for visualization generation (default: google/gemini-3.1-flash-image-preview)
      IMAGE_MODEL: "google/gemini-3.1-flash-image-preview"
      # ZenMux API key for visualization image generation (primary provider, comma-separated for load balancing)
      # Single key:   ZENMUX_API_KEY: "zk-abc123"
      # Multiple keys: ZENMUX_API_KEY: "zk-abc123,zk-def456,zk-ghi789"
      ZENMUX_API_KEY: ""
      # Google Gemini API key — fallback for visualization image generation
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      # Daily visualization generation limit for subscribed students (default: 2)
      VISUALIZATION_DAILY_LIMIT_SUBSCRIPTION: "2"
      # Daily visualization generation limit for free-tier students (default: 1)
      VISUALIZATION_DAILY_LIMIT_FREE: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      AUTH_SECRET: ""
      # Get Google OAuth credentials from: https://console.cloud.google.com/apis/credentials
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://read.mr5ai.com"
      # Admin email addresses (comma-separated, case-insensitive)
      ADMIN_EMAILS: ""
      # Super-admin email addresses (comma-separated, case-insensitive)
      # Super-admins have full system access across all schools
      SUPER_ADMIN_EMAILS: ""
      # Stripe Configuration
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      SUBSCRIPTION_MONTHLY_PRICE: "9.99"
      # Monthly price per seat for school subscriptions (defaults to SUBSCRIPTION_MONTHLY_PRICE if not set)
      SCHOOL_SUBSCRIPTION_MONTHLY_PRICE: ""
      SUBSCRIPTION_CURRENCY: "usd"
      # Separate API key for subscription-based AI usage
      OPENAI_COMPATIBLE_SUBSCRIPTION_API_KEY: ""
      # Trial period in days for personal subscriptions (default: 1)
      SUBSCRIPTION_TRIAL_PERIOD_DAYS: "1"
      # Trial period in days for school subscriptions (default: 1)
      SCHOOL_SUBSCRIPTION_TRIAL_PERIOD_DAYS: "1"
      # Hours before trial ends to send notification email for personal subscriptions (default: 6)
      TRIAL_ENDING_NOTIFICATION_HOURS: "6"
      # Hours before trial ends to send notification email for school subscriptions (default: 6)
      SCHOOL_TRIAL_ENDING_NOTIFICATION_HOURS: "6"
      # Session Security Configuration
      # Session maximum lifetime in seconds (default: 259200 = 3 days)
      SESSION_MAX_AGE: "259200"
      # Maximum concurrent active sessions per user — oldest sessions are pruned on new sign-in (default: 3)
      MAX_CONCURRENT_SESSIONS: "3"
      # Client-side idle timeout in minutes — users are signed out after this many minutes of inactivity (default: 30)
      SESSION_IDLE_TIMEOUT_MINUTES: "30"
      # Realtime (Socket.io) server URL the browser connects to for multiplayer
      # spelling battles. Server-side runtime variable exposed via /api/config.
      # Empty string disables the multiplayer option in the UI.
      REALTIME_URL: "${REALTIME_URL:-http://localhost:3001}"

  # Realtime (Socket.io) server for multiplayer spelling battles.
  # Shares AUTH_SECRET + DATABASE_URL with the app. The app issues short-lived
  # HMAC tickets (signed with AUTH_SECRET) via /api/realtime/ticket; this server
  # verifies them at connection time (no shared DB dependency for auth).
  realtime:
    build:
      context: ./realtime
    # To use a pre-built image from GHCR instead of building locally, comment
    # out `build` above and uncomment `image` (set by CI in ghcr.yml):
    # image: ghcr.io/bentwnghk/reading-assistant-realtime:latest
    container_name: reading-assistant-realtime
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    environment:
      # Port the Socket.io + healthcheck HTTP server listens on (default: 3001)
      REALTIME_PORT: "3001"
      # Comma-separated allowed CORS origins (the Next.js app origin)
      REALTIME_CORS_ORIGIN: "${REALTIME_CORS_ORIGIN:-http://localhost:3000}"
      # Shared with the app — used to verify HMAC-signed auth tickets
      AUTH_SECRET: ""
      # Reused for word-list fetching (glossary / vocabulary bank / review lists)
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

volumes:
  reading-assistant_postgres_data:
