version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: reading-assistant-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - reading-assistant_postgres_data:/var/lib/postgresql/data
      - /home/user/reading-assistant/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 24g
        reservations:
          memory: 12g
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "effective_cache_size=18GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "checkpoint_completion_target=0.9"

  reading-assistant:
    image: 
    container_name: reading-assistant
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g
    environment:
      # Access Password (comma-separated, case-sensitive)
      ACCESS_PASSWORD: ""
      OPENAI_COMPATIBLE_API_BASE_URL: "https://api.mr5ai.com"
      OPENAI_COMPATIBLE_API_KEY: ""
      # Fallback model when the primary AI model fails (default: gemini-3-flash-preview)
      FALLBACK_MODEL: "gemini-3-flash-preview"
      # Text-to-image model for visualization generation (default: google/gemini-3.1-flash-image-preview)
      IMAGE_MODEL: "google/gemini-3.1-flash-image-preview"
      # ZenMux API key for visualization image generation (primary provider)
      ZENMUX_API_KEY: ""
      # Google Gemini API key — fallback for visualization image generation
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      AUTH_SECRET: ""
      # Get Google OAuth credentials from: https://console.cloud.google.com/apis/credentials
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://read.mr5ai.com"
      # Admin email addresses (comma-separated, case-insensitive)
      ADMIN_EMAILS: ""
      # Super-admin email addresses (comma-separated, case-insensitive)
      # Super-admins have full system access across all schools
      SUPER_ADMIN_EMAILS: ""
      # Stripe Configuration
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      SUBSCRIPTION_MONTHLY_PRICE: "9.99"
      # Monthly price per seat for school subscriptions (defaults to SUBSCRIPTION_MONTHLY_PRICE if not set)
      SCHOOL_SUBSCRIPTION_MONTHLY_PRICE: ""
      SUBSCRIPTION_CURRENCY: "usd"
      # Separate API key for subscription-based AI usage
      OPENAI_COMPATIBLE_SUBSCRIPTION_API_KEY: ""
      # Trial period in days for personal subscriptions (default: 1)
      SUBSCRIPTION_TRIAL_PERIOD_DAYS: "1"
      # Trial period in days for school subscriptions (default: 1)
      SCHOOL_SUBSCRIPTION_TRIAL_PERIOD_DAYS: "1"
      # Hours before trial ends to send notification email for personal subscriptions (default: 6)
      TRIAL_ENDING_NOTIFICATION_HOURS: "6"
      # Hours before trial ends to send notification email for school subscriptions (default: 6)
      SCHOOL_TRIAL_ENDING_NOTIFICATION_HOURS: "6"

volumes:
  reading-assistant_postgres_data:
